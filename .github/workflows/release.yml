name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libx11-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package
        run: |
          set -eux
          TARGET="${{ matrix.target }}"
          PACKAGE="roinroin-${TARGET}"
          mkdir -p "dist/${PACKAGE}"
          cp "target/${TARGET}/release/roinroin" "dist/${PACKAGE}/"
          cp README.md LICENSE roinroin.example.toml "dist/${PACKAGE}/"
          cp assets/roinroin.desktop assets/roinroin.svg "dist/${PACKAGE}/"
          tar -czf "dist/${PACKAGE}.tar.gz" -C "dist/${PACKAGE}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: roinroin-${{ matrix.target }}
          path: dist/roinroin-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*.tar.gz
          generate_release_notes: true
