[package]
name = "roinroin"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Native Linux tribune client for gb2c and direct bouchots"
license = "MIT"
repository = "https://github.com/zorel/roinroin"

[dependencies]
iced = { version = "0.14", default-features = false, features = [
    "advanced",
    "crisp",
    "image",
    "linux-theme-detection",
    "svg",
    "tiny-skia",
    "tokio",
    "wgpu",
    "wayland",
    "x11",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "multipart",
] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
quick-xml = "0.38"
regex = "1"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "serde",
    "std",
] }
chrono-tz = "0.10"
notify-rust = "4"
url = "2"
directories = "6"
open = "5"
bytes = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
